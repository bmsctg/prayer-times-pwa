<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#0f5132" />
  <meta name="description" content="Accurate Islamic prayer times in Sweden with push notifications, offline support, and Qibla compass." />
  <title>Prayer Times – Sweden PWA</title>
  
  <link rel="manifest" href="manifest.json" />
  <link rel="icon" type="image/png" sizes="192x192" href="icon-192.png" />
  <link rel="apple-touch-icon" href="icon-192.png" />
  
  <!-- Modern Font -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="app-container">
    
    <!-- Top Header -->
    <header class="header">
      <div class="header-top">
        <div class="brand">
          <svg class="moon-icon" viewBox="0 0 24 24" width="26" height="26" fill="currentColor">
            <path d="M12 2a10 10 0 1 0 10 10 7 7 0 0 1-7-7 7 7 0 0 1-3-3z"/>
          </svg>
          <h1>Prayer Times</h1>
        </div>
        <div class="header-actions">
          <button type="button" id="audio-toggle-btn" class="icon-btn" title="Toggle Adhan Chime" aria-label="Toggle audio">
            <svg id="audio-icon-on" viewBox="0 0 24 24" width="20" height="20" fill="currentColor">
              <path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/>
            </svg>
            <svg id="audio-icon-off" viewBox="0 0 24 24" width="20" height="20" fill="currentColor" style="display:none">
              <path d="M16.5 12c0-1.77-1.02-3.29-2.5-4.03v2.21l2.45 2.45c.03-.2.05-.41.05-.63zm2.5 0c0 .94-.2 1.82-.54 2.64l1.51 1.51C20.63 14.91 21 13.5 21 12c0-4.28-2.99-7.86-7-8.77v2.06c2.89.86 5 3.54 5 6.71zM4.27 3L3 4.27 7.73 9H3v6h4l5 5v-6.73l4.25 4.25c-.67.52-1.42.93-2.25 1.18v2.06c1.38-.31 2.63-.95 3.69-1.81L19.73 21 21 19.73 4.27 3zM12 4L9.91 6.09 12 8.18V4z"/>
            </svg>
          </button>
          <button type="button" id="theme-toggle-btn" class="icon-btn" title="Toggle Light/Dark Theme" aria-label="Toggle theme">
            <svg class="sun-icon" viewBox="0 0 24 24" width="20" height="20" fill="currentColor">
              <path d="M12 7c-2.76 0-5 2.24-5 5s2.24 5 5 5 5-2.24 5-5-2.24-5-5-5zM2 13h2c.55 0 1-.45 1-1s-.45-1-1-1H2c-.55 0-1 .45-1 1s.45 1 1 1zm18 0h2c.55 0 1-.45 1-1s-.45-1-1-1h-2c-.55 0-1 .45-1 1s.45 1 1 1zM11 2v2c0 .55.45 1 1 1s1-.45 1-1V2c0-.55-.45-1-1-1s-1 .45-1 1zm0 18v2c0 .55.45 1 1 1s1-.45 1-1v-2c0-.55-.45-1-1-1s-1 .45-1 1zM5.99 4.58c-.39-.39-1.03-.39-1.41 0s-.39 1.03 0 1.41l1.06 1.06c.39.39 1.03.39 1.41 0s.39-1.03 0-1.41L5.99 4.58zm12.37 12.37c-.39-.39-1.03-.39-1.41 0s-.39 1.03 0 1.41l1.06 1.06c.39.39 1.03.39 1.41 0s.39-1.03 0-1.41l-1.06-1.06zM7.05 18.36l-1.06 1.06c-.39.39-.39 1.03 0 1.41s1.03.39 1.41 0l1.06-1.06c.39-.39.39-1.03 0-1.41s-1.02-.39-1.41 0zm12.37-13.78l-1.06 1.06c-.39.39-.39 1.03 0 1.41s1.03.39 1.41 0l1.06-1.06c.39-.39.39-1.03 0-1.41s-1.03-.39-1.41 0z"/>
            </svg>
          </button>
        </div>
      </div>
      <div class="date-header">
        <p id="date-today" class="date-line">—</p>
        <p id="hijri-date" class="hijri-line">—</p>
      </div>
    </header>

    <!-- Location & Calculation Method Bar -->
    <div class="settings-bar">
      <div class="select-group">
        <select id="place-select" aria-label="Select City">
          <option value="vasterhaninge">Västerhaninge</option>
          <option value="stockholm" selected>Stockholm</option>
          <option value="gothenburg">Gothenburg (Göteborg)</option>
          <option value="malmo">Malmö</option>
          <option value="uppsala">Uppsala</option>
          <option value="vasteras">Västerås</option>
          <option value="orebro">Örebro</option>
          <option value="linkoping">Linköping</option>
          <option value="helsingborg">Helsingborg</option>
        </select>
        <button type="button" id="gps-btn" class="gps-btn" title="Use Current GPS Location" aria-label="Use GPS Location">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor">
            <path d="M12 8c-2.21 0-4 1.79-4 4s1.79 4 4 4 4-1.79 4-4-1.79-4-4-4zm8.94 3A8.994 8.994 0 0 0 13 3.06V1h-2v2.06A8.994 8.994 0 0 0 3.06 11H1v2h2.06A8.994 8.994 0 0 0 11 20.94V23h2v-2.06A8.994 8.994 0 0 0 20.94 13H23v-2h-2.06zM12 19c-3.87 0-7-3.13-7-7s3.13-7 7-7 7 3.13 7 7-3.13 7-7 7z"/>
          </svg>
        </button>
      </div>

      <select id="source-select" class="source-select" aria-label="Select Calculation Source">
        <option value="ifis" selected>Islamiska Förbundet (IFIS)</option>
        <option value="aladhan">Aladhan (MWL Method)</option>
      </select>
    </div>

    <!-- Hero Card: Next Prayer & Circular Countdown -->
    <div id="next-prayer-banner" class="next-prayer-banner">
      <div class="banner-top">
        <span id="banner-label" class="banner-label">Next Prayer</span>
        <span id="banner-prayer-at" class="banner-at">at --:--</span>
      </div>
      <div class="banner-body">
        <h2 id="banner-prayer-name" class="banner-name">—</h2>
        <div id="banner-countdown" class="banner-countdown">—</div>
      </div>
      <div class="progress-bar-container">
        <div id="prayer-progress-bar" class="progress-bar-fill" style="width: 0%"></div>
      </div>
    </div>

    <!-- Prayer Times List -->
    <ul id="prayer-times" class="prayer-times-list"></ul>

    <!-- Day Navigation Controls -->
    <div class="day-nav">
      <button type="button" id="prev-day-btn" class="nav-btn" disabled aria-label="Previous day">&#8249;</button>
      <button type="button" id="today-btn" class="nav-btn nav-btn--today" disabled>Today</button>
      <button type="button" id="next-day-btn" class="nav-btn" aria-label="Next day">&#8250;</button>
    </div>

    <!-- Notification Service Card -->
    <div class="notify-card glass-card">
      <div class="notify-header">
        <label class="notify-toggle">
          <input type="checkbox" id="notify-check" />
          <span class="notify-slider"></span>
          <span class="notify-label-text">Enable Prayer Alerts</span>
        </label>
        <button type="button" id="test-notify-btn" class="btn-secondary btn-sm">Test Alert</button>
      </div>
      <p id="notify-status" class="notify-status">Checking notification status...</p>
    </div>

    <!-- Graphical Qibla Compass Card -->
    <div class="qibla-card glass-card">
      <div class="qibla-header">
        <span class="qibla-title">Qibla Compass</span>
        <span id="qibla-degrees" class="qibla-degrees">137.5°</span>
      </div>
      <div class="compass-wrapper">
        <div class="compass-dial">
          <div class="compass-mark north">N</div>
          <div class="compass-mark east">E</div>
          <div class="compass-mark south">S</div>
          <div class="compass-mark west">W</div>
          <div id="compass-needle" class="compass-needle" style="transform: rotate(137.5deg)">
            <div class="kaaba-icon-pin">🕋</div>
          </div>
        </div>
      </div>
      <p id="qibla-text" class="qibla-text">Direction towards the Kaaba</p>
      <a href="https://qiblafinder.withgoogle.com/" target="_blank" rel="noopener" class="qibla-btn">
        <span>Open AR Qibla Finder</span>
        <svg viewBox="0 0 24 24" width="16" height="16" fill="currentColor">
          <path d="M19 19H5V5h7V3H5c-1.11 0-2 .9-2 2v14c0 1.1.89 2 2 2h14c1.1 0 2-.9 2-2v-7h-2v7zM14 3v2h3.59l-9.83 9.83 1.41 1.41L19 6.41V10h2V3h-7z"/>
        </svg>
      </a>
    </div>

    <!-- Footer -->
    <footer class="copyright">
      &copy; 2026 BMS • Sweden Prayer Times PWA
    </footer>

  </div>

  <script src="app.js"></script>
</body>
</html>
